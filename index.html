let S={prods:{},mesas:{},vendas:[],bol:[],pin:''},PED=[],DB=null,pc={},ok=false,pf={nome:'',tel:'',ent:'Entrega',end:'',pg:'Pix',obs:''},V=M?'cliente':P?'pedir':'caixa',cart=[],mesa='',own=false,ref=null,msg='',pend='';
function init(d){if(d)S=Object.assign({prods:{},mesas:{},vendas:[],bol:[],pin:''},d);draw()}
async function save(){try{if(ref)await ref.set(S);else localStorage.setItem('nx',JSON.stringify(S))}catch(e){msg='Não foi possível salvar';draw()}}
(async()=>{let c=null;try{c=await claude.use('db')}catch(e){}
if(c){DB=c;ref=c.doc('app/state');if(!M&&!P)c.collection('pedidos').onSnapshot(q=>{PED=q.docs.map(d=>d.data());draw()},()=>{});ref.onSnapshot(s=>{if(s.exists)init(s.data());else draw()},()=>draw())}
else{try{init(JSON.parse(localStorage.getItem('nx')))}catch(e){draw()}}})();
const tm=n=>(S.mesas[n]||[]).reduce((a,i)=>a+i.p*i.q,0),ct=()=>cart.reduce((a,c)=>a+c.p*c.q,0);
function draw(){const n=$('#nav'),m=$('#m');
if(M||P){n.innerHTML='';m.innerHTML=M?cliente():pedir();return}
n.innerHTML=[['caixa','Caixa'],['prod','Produtos'],['mesas','Mesas'],['ped','Pedidos'+(np()?' ('+np()+')':'')],['dono','Dono 🔒']].map(([k,l])=>`<button class="${V==k?'on':''}" onclick="V='${k}';draw()">${l}</button>`).join('');
m.innerHTML=({caixa,prod,mesas,ped:pedidos,dono})[V]()+(msg?`<p class=card>${msg}</p>`:'');msg='';
const i=$('#sc');if(i)i.focus()}
const SC=`<input id=sc placeholder="Bipe o produto aqui" style="width:100%" onkeydown="if(event.key=='Enter'){bip(this.value.trim());this.value=''}">`;
function bip(c){if(!c)return;if(V=='prod'){pend=c;draw();return}
const p=S.prods[c];if(!p){pend=c;V='prod';msg='Produto novo: cadastre abaixo';draw();return}
const x=cart.find(i=>i.c==c);x?x.q++:cart.push({c,n:p.n,p:p.p,q:1});draw()}
function qt(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);draw()}
function fim(pg){if(!cart.length)return;
cart.forEach(c=>{if(S.prods[c.c])S.prods[c.c].q-=c.q});
if(pg=='mesa')(S.mesas[mesa]=S.mesas[mesa]||[]).push(...cart.map(c=>({n:c.n,p:c.p,q:c.q})));
else S.vendas.push({t:Date.now(),v:ct(),pg,mesa:''});
cart=[];save();draw()}
function caixa(){return `<div class="card full">${SC}<div class=row><select onchange="mesa=this.value;draw()"><option value="">Balcão (pagar agora)</option>${[...Array(30)].map((_,i)=>`<option value=${i+1} ${mesa==i+1?'selected':''}>Mesa ${i+1}</option>`).join('')}</select></div></div>
<div class=card><table>${cart.map((c,i)=>`<tr><td>${E(c.n)}</td><td><button onclick="qt(${i},-1)">−</button> ${c.q} <button onclick="qt(${i},1)">+</button></td><td>${R(c.p*c.q)}</td></tr>`).join('')||'<tr><td>Nenhum item</td></tr>'}</table>
<div class=tot>${R(ct())}</div><div class=row>${mesa?`<button class=g onclick="fim('mesa')">Lançar na Mesa ${mesa}</button>`:PG.map(p=>`<button class=g onclick="fim('${p}')">${p}</button>`).join('')}</div></div>`}
function prod(){const p=S.prods[pend]||{};
return `<div class=card>${SC.replace('Bipe o produto aqui','Bipe para cadastrar ou dar entrada')}
${pend?`<p>Código <b>${E(pend)}</b> ${p.n?'· em estoque: '+p.q:'· novo'}</p><div class=row><input id=pn placeholder=Nome value="${E(p.n||'')}"><input id=pp type=number step=.01 placeholder=Preço value="${p.p||''}"></div><div class=row><input id=pq type=number placeholder="Quantidade que entrou"><button class=g onclick="sp()">Salvar</button></div>`:''}</div>
<div class=card><table>${Object.entries(S.prods).map(([c,p])=>`<tr onclick="pend='${E(c)}';draw()"><td>${E(p.n)}</td><td>${R(p.p)}</td><td>${p.q} un</td></tr>`).join('')||'<tr><td>Nenhum produto ainda</td></tr>'}</table></div>`}
function sp(){const c=pend,o=S.prods[c];if(!$('#pn').value||!$('#pp').value){msg='Preencha nome e preço';draw();return}
if(o&&o.p!=+$('#pp').value&&!own){msg='Só o dono altera preço (entre na aba Dono)';draw();return}
S.prods[c]={n:$('#pn').value,p:+$('#pp').value,q:(o?o.q:0)+(+$('#pq').value||0)};pend='';save();draw()}
function mesas(){return Object.keys(S.mesas).map(n=>`<div class=card><b>Mesa ${n}</b> <span class=tot style="font-size:22px">${R(tm(n))}</span>${S.mesas[n].map(i=>`<div>${i.q}× ${E(i.n)} — ${R(i.p*i.q)}</div>`).join('')}<div class=row>${PG.map(p=>`<button class=g onclick="cm(${n},'${p}')">${p}</button>`).join('')}</div></div>`).join('')||'<p class=card>Nenhuma mesa aberta</p>'}
function cm(n,pg){S.vendas.push({t:Date.now(),v:tm(n),pg,mesa:n});delete S.mesas[n];save();draw()}
function cliente(){return `<div class=card><h2>Mesa ${M}</h2>${(S.mesas[M]||[]).map(i=>`<div>${i.q}× ${E(i.n)} — ${R(i.p*i.q)}</div>`).join('')||'<p>Nenhum item lançado ainda</p>'}<div class=tot>${R(tm(M))}</div><small>Atualiza sozinho</small></div>`}
function lg(){const w=$('#pw').value;if(!w)return;if(!S.pin){S.pin=w;save()}own=w==S.pin;if(!own)msg='Senha incorreta';draw()}
function ab(){if(!$('#bd').value||!$('#bv').value)return;S.bol.push({d:$('#bd').value,val:+$('#bv').value,v:$('#bt').value,pago:false});save();draw()}
function qr(){const n=$('#qn').value;if(!n)return;const e=$('#qc');e.style.display='block';e.innerHTML='<div style="color:#000;font-weight:700">Mesa '+n+'</div>';new QRCode(e,location.href.split('#')[0]+'#mesa-'+n)}
const PL=()=>DB?PED:(S.ped||[]),np=()=>PL().filter(o=>o.st=='novo').length,tp=o=>o.it.reduce((a,i)=>a+i.p*i.q,0);
function pedidos(){const L=PL().slice().sort((a,b)=>b.id-a.id);
return `<div class="card full"><small>Link para o cliente pedir: <b>${E(location.href.split('#')[0])}#pedidos</b></small></div>`+(L.map(o=>`<div class=card><b>${E(o.nome)}</b> · ${E(o.tel)} <small>${o.st}</small><div>${o.ent}${o.end?': '+E(o.end):''} · ${o.pg}</div>${o.it.map(i=>`<div>${i.q}× ${E(i.n)}</div>`).join('')}${o.obs?`<div><small>${E(o.obs)}</small></div>`:''}<div class=tot style="font-size:22px">${R(tp(o))}</div>${o.st=='novo'?`<button class=g onclick="po(${o.id},'entregue')">Entregue (lançar venda)</button> <button onclick="po(${o.id},'cancelado')">Cancelar</button>`:''}</div>`).join('')||'<p class=card>Nenhum pedido ainda</p>')}
function po(id,st){const o=PL().find(x=>x.id==id);if(!o)return;o.st=st;
if(st=='entregue'){o.it.forEach(i=>{if(S.prods[i.c])S.prods[i.c].q-=i.q});S.vendas.push({t:Date.now(),v:tp(o),pg:o.pg,mesa:''});save()}
if(DB)DB.collection('pedidos').doc(String(id)).set(o);else save();draw()}
function pa(c,d){const q=(pc[c]||0)+d;if(q<1)delete pc[c];else if(q<=S.prods[c].q)pc[c]=q;draw()}
function pedir(){const mm=msg;msg='';
if(ok)return `<div class="card hero"><h2>Pedido enviado! 🎉</h2><p>Recebemos seu pedido e já vamos confirmar com você.</p><button class=g onclick="ok=false;draw()">Fazer outro pedido</button></div>`;
const L=Object.entries(S.prods).filter(([c,p])=>p.q>0),t=Object.entries(pc).reduce((a,[c,q])=>a+S.prods[c].p*q,0),I=(k,ph,ty='text')=>`<input type=${ty} placeholder="${ph}" value="${E(pf[k])}" oninput="pf.${k}=this.value">`;
return `<div class="card hero">${EMB}<h2>Peça pela Next</h2><small>Bebidas e tabacaria · Sempre com você!</small></div>
<div class=card>${L.map(([c,p])=>`<div class=row><span>${E(p.n)}<br><small>${R(p.p)}</small></span><span class=s><button onclick="pa('${E(c)}',-1)">−</button> ${pc[c]||0} <button onclick="pa('${E(c)}',1)">+</button></span></div>`).join('')||'<p>Cardápio em breve</p>'}<div class=tot>${R(t)}</div></div>
<div class=card><div class=row>${I('nome','Seu nome')}${I('tel','Telefone / WhatsApp','tel')}</div><div class=row><select onchange="pf.ent=this.value;draw()">${['Entrega','Retirada'].map(x=>`<option ${pf.ent==x?'selected':''}>${x}</option>`).join('')}</select><select onchange="pf.pg=this.value">${PG.map(x=>`<option ${pf.pg==x?'selected':''}>${x}</option>`).join('')}</select></div>${pf.ent=='Entrega'?`<div class=row>${I('end','Endereço de entrega')}</div>`:''}<div class=row>${I('obs','Observações')}</div>${mm?`<p>${mm}</p>`:''}<button class=g style="width:100%" onclick="env()">Enviar pedido</button></div>`}
function env(){const it=Object.entries(pc).map(([c,q])=>({c,n:S.prods[c].n,p:S.prods[c].p,q}));
if(!it.length||!pf.nome||!pf.tel||(pf.ent=='Entrega'&&!pf.end)){msg='Escolha os itens e preencha nome, telefone e endereço';draw();return}
const o={id:Date.now(),it,...pf,st:'novo'};
(DB?DB.collection('pedidos').doc(String(o.id)).set(o):Promise.resolve((S.ped=S.ped||[]).push(o)).then(save)).then(()=>{pc={};ok=true;draw()}).catch(()=>{msg='Não foi possível enviar. Tente novamente.';draw()})}
function trocaSenha(){const a=$('#pwa').value,n=$('#pwn').value,r=$('#pwr').value;if(a!=S.pin){msg='Senha atual incorreta';draw();return}if(n.length<4){msg='A nova senha precisa ter pelo menos 4 caracteres';draw();return}if(n!=r){msg='A confirmação da nova senha não confere';draw();return}S.pin=n;save();msg='Senha alterada com sucesso ✓';draw()}
function dono(){if(!own)return `<div class=card><p>${S.pin?'Digite a senha do dono':'Crie a senha do dono'}</p><div class=row><input id=pw type=password><button class=g onclick="lg()">Entrar</button></div></div>`;
const d=t=>new Date(t).toLocaleDateString('sv'),h=d(Date.now()),f=a=>S.vendas.filter(a).reduce((x,v)=>x+v.v,0),
mes=f(v=>d(v.t).slice(0,7)==h.slice(0,7)),bp=S.bol.filter(b=>!b.pago).reduce((a,b)=>a+b.val,0);
return `<div class=card><div>Faturado hoje</div><div class=tot>${R(f(v=>d(v.t)==h))}</div><div>No mês: <b>${R(mes)}</b> · Boletos em aberto: <b>${R(bp)}</b></div>
<small>${PG.map(p=>p+' '+R(f(v=>v.pg==p&&d(v.t).slice(0,7)==h.slice(0,7)))).join(' · ')}</small></div>
<div class=card><b>Boletos</b><div class=row><input id=bd placeholder=Descrição><input id=bv type=number step=.01 placeholder=Valor><input id=bt type=date><button class=g onclick="ab()">+</button></div>
${S.bol.map((b,i)=>`<div class=row><span>${E(b.d)} · ${R(b.val)} · ${E(b.v)}</span><button class=s onclick="S.bol[${i}].pago=!S.bol[${i}].pago;save();draw()">${b.pago?'Pago ✓':'Pagar'}</button><button class=s onclick="S.bol.splice(${i},1);save();draw()">🗑</button></div>`).join('')}</div>
${per()}${nota()}
<div class=card><b>QR das mesas</b><div class=row><input id=qn type=number placeholder="Nº da mesa"><button class=g onclick="qr()">Gerar</button></div><div id=qc style="background:#fff;padding:12px;display:none;width:fit-content"></div></div>
<div class=card><b>Alterar senha do dono</b><div class=row><input id=pwa type=password placeholder="Senha atual"></div><div class=row><input id=pwn type=password placeholder="Nova senha"></div><div class=row><input id=pwr type=password placeholder="Repita a nova senha"><button class=g onclick="trocaSenha()">Salvar</button></div></div>`}
let NT={it:[],mg:'',est:false,busy:false,err:''},PR={a:'',b:''};
const nm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
function mt(x){const c=String(x.codigo||'').trim();if(c&&S.prods[c])return c;const n=nm(x.nome);if(n.length<4)return '';return Object.keys(S.prods).find(k=>{const m=nm(S.prods[k].n);return m&&(m==n||m.includes(n)||n.includes(m))})||''}
function rc(){const m=parseFloat(NT.mg);if(isNaN(m))return;NT.it.forEach(x=>{if(x.c)x.pv=Math.round(x.cu*(1+m/100)*100)/100})}
function rz(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};i.onerror=no;i.src=URL.createObjectURL(f)})}
async function ln(){const f=$('#nf')&&$('#nf').files[0];if(!f){msg='Tire ou escolha a foto da nota primeiro';draw();return}
NT.busy=true;NT.err='';draw();
try{const sm=await claude.use('sample');if(!sm)throw 0;const b=await rz(f);
const r=await sm.json('Esta é a foto de uma nota de compra de mercadorias de uma conveniência. Liste cada item comprado. Responda SOMENTE com JSON no formato [{"codigo":"código de barras ou do produto, ou vazio","nome":"descrição","qtd":número,"custo":preço unitário em reais, número}]. Se só houver o total do item, divida pela quantidade. Não invente itens.',{images:[b],cache:false});
const L=Array.isArray(r)?r:(r&&r.itens)||[];
NT.it=L.map(x=>{const c=mt(x);return {c,n:String(x.nome||''),q:+x.qtd||0,cu:+x.custo||0,pv:c?S.prods[c].p:0,on:!!c}});rc();if(!NT.it.length)NT.err='Não encontrei itens na foto. Tente de mais perto e com boa luz.'}
catch(e){NT.err='Não consegui ler a nota. Tente outra foto, de perto e com boa luz.'}
NT.busy=false;draw()}
function ap(){let n=0;NT.it.forEach(x=>{if(!x.on||!x.c||!x.pv)return;const o=S.prods[x.c];S.prods[x.c]={n:o.n,p:x.pv,q:o.q+(NT.est?x.q:0),cu:x.cu};n++});NT.it=[];save();msg=n+' preço(s) atualizado(s) pela nota';draw()}
function nota(){const t=NT.it;
return `<div class=card><b>Nota de compra (foto)</b><div class=row><input id=nf type=file accept="image/*"><input type=number step=.1 placeholder="Margem % sobre o custo" value="${E(NT.mg)}" onchange="NT.mg=this.value;rc();if(NT.it.length)draw()"></div><div class=row><button class=g onclick="ln()" ${NT.busy?'disabled':''}>${NT.busy?'Lendo a nota...':'Ler nota'}</button></div>${NT.err?`<p>${NT.err}</p>`:''}
${t.length?`<table>${t.map((x,i)=>`<tr><td><input type=checkbox ${x.on?'checked':''} ${x.c?'':'disabled'} onchange="NT.it[${i}].on=this.checked"></td><td>${E(x.n)}<br><small>${x.c?x.q+' un · custo '+R(x.cu)+' · atual '+R(S.prods[x.c].p):'não encontrado no cadastro: cadastre em Produtos'}</small></td><td>${x.c?`<input type=number step=.01 value="${x.pv}" style="width:90px" onchange="NT.it[${i}].pv=+this.value">`:''}</td></tr>`).join('')}</table><label><input type=checkbox ${NT.est?'checked':''} onchange="NT.est=this.checked"> Dar entrada no estoque também</label><div class=row><button class=g onclick="ap()">Aplicar preços</button></div>`:''}</div>`}
function per(){const d=t=>new Date(t).toLocaleDateString('sv'),b=PR.b||d(Date.now()),a=PR.a||d(Date.now()-6*864e5),s=S.vendas.filter(v=>d(v.t)>=a&&d(v.t)<=b).reduce((x,v)=>x+v.v,0);
return `<div class=card><b>Faturamento por período</b><div class=row><input type=date value="${a}" onchange="PR.a=this.value;draw()"><input type=date value="${b}" onchange="PR.b=this.value;draw()"></div><div class=tot>${R(s)}</div></div>`}
</script></body></html>
